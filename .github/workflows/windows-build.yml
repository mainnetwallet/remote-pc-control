name: Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
    tags: ["v*"]

permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: python -m pip install -e ".[build]"
      - name: Build dashboard
        working-directory: frontend
        run: |
          npm install
          npm run build
      - name: Package agent
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force backend/app/static | Out-Null
          Copy-Item -Recurse -Force frontend/dist/* backend/app/static/
          pyinstaller --noconfirm --clean --onefile --noconsole --uac-admin --name RemotePCControl --paths backend --add-data "backend/app/static;backend/app/static" --add-data "backend/app/static;app/static" --add-data "backend/app/panel.html;backend/app" --add-data "backend/app/panel.html;app" --hidden-import tkinter --hidden-import mss --hidden-import pynput.keyboard --hidden-import pynput.mouse --collect-all aiortc --collect-all av --collect-all aioice --collect-all pylibsrtp --collect-all google_crc32c run_agent.py
      - name: Build setup installer
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          & $iscc installer/RemotePCControl.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: RemotePCControl-Windows-x64
          path: |
            dist/RemotePCControl.exe
            dist-installer/RemotePCControl-Setup.exe
      - name: Publish installer to GitHub Release
        if: github.event_name != 'workflow_dispatch' || github.ref_type == 'branch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-build-${{ github.run_number }}"
          Copy-Item dist-installer/RemotePCControl-Setup.exe "RemotePCControl-Setup-$tag.exe"
          gh release create $tag "RemotePCControl-Setup-$tag.exe" --target "${{ github.sha }}" --title "Windows installer #${{ github.run_number }}" --notes "RemotePCControl-Setup.exe built from commit ${{ github.sha }}. Run it once: it sets up administrator rights, autostart and the firewall rule."
