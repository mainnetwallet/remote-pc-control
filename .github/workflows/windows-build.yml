name: Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
    tags: ["v*"]

permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: python -m pip install -e ".[build]"
      - name: Build dashboard
        working-directory: frontend
        run: |
          npm install
          npm run build
      - name: Package agent
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force backend/app/static | Out-Null
          Copy-Item -Recurse -Force frontend/dist/* backend/app/static/
          pyinstaller --noconfirm --clean --onefile --noconsole --uac-admin --icon assets/app.ico --name RemotePCControl --paths backend --add-data "backend/app/static;backend/app/static" --add-data "backend/app/static;app/static" --add-data "assets/app.ico;assets" --hidden-import tkinter --hidden-import mss --hidden-import pynput.keyboard --hidden-import pynput.mouse --collect-all aiortc --collect-all av --collect-all aioice --collect-all pylibsrtp --collect-all google_crc32c run_agent.py
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Build built-in Tailscale (tsbridge.exe)
        shell: pwsh
        working-directory: tsbridge
        run: |
          go get tailscale.com/tsnet@latest
          go mod tidy
          New-Item -ItemType Directory -Force ../dist | Out-Null
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o ../dist/tsbridge.exe .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item ../dist/tsbridge.exe | ForEach-Object { Write-Host "tsbridge.exe $([math]::Round($_.Length/1MB,1)) MB" }
      - name: Smoke test the packaged exe
        shell: pwsh
        run: |
          # Starts the real exe like the autostart task does and checks that the server and the control panel answer.
          $env:LOCALAPPDATA = Join-Path $PWD "smoke-data"
          New-Item -ItemType Directory -Force $env:LOCALAPPDATA | Out-Null
          $p = Start-Process -FilePath (Join-Path $PWD "dist\RemotePCControl.exe") -ArgumentList "--background" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 90 -and -not $ok; $i++) {
            Start-Sleep -Seconds 1
            try { if ((Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8888/api/health" -TimeoutSec 2).StatusCode -eq 200) { $ok = $true } } catch {}
          }
          $problems = @()
          if (-not $ok) { $problems += "server did not answer on port 8888 (process exited: $($p.HasExited))" }
          else {
            foreach ($path in "/", "/panel/api/state") {
              try {
                $h = @{}
                if ($path -like "/panel/*") { $tok = ((Get-Content (Join-Path $env:LOCALAPPDATA "RemotePCControl\.env")) | Where-Object { $_ -like "REMOTE_PC_TOKEN=*" }) -replace "^REMOTE_PC_TOKEN=", ""; $h = @{ Authorization = "Bearer $tok" } }
                $r = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8888$path" -Headers $h -TimeoutSec 5; Write-Host "GET $path -> $($r.StatusCode), $($r.Content.Length) bytes"
              } catch { $problems += "GET $path failed: $($_.Exception.Message)" }
            }
            try { Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8888/panel" -TimeoutSec 5 | Out-Null; $problems += "the old web page /panel still answers" } catch { Write-Host "GET /panel -> gone (expected)" }
          }
          $dir = Join-Path $env:LOCALAPPDATA "RemotePCControl"
          if (Test-Path $dir) { Get-ChildItem $dir -Filter *.log | ForEach-Object { Write-Host "=== $($_.Name)"; Get-Content $_.FullName -Tail 80 } }
          taskkill /F /T /PID $p.Id 2>$null | Out-Null
          if ($problems.Count) { $problems | ForEach-Object { Write-Host "::error::$_" }; exit 1 }
      - name: Window smoke test of the packaged exe
        shell: pwsh
        run: |
          # The exe must be able to open its own app window (tkinter and its data are inside the exe), with nothing else installed.
          $out = Join-Path $PWD "gui-selftest.txt"
          $p = Start-Process -FilePath (Join-Path $PWD "dist\RemotePCControl.exe") -ArgumentList "--gui-selftest", $out -PassThru -Wait
          $text = if (Test-Path $out) { Get-Content $out -Raw } else { "(no result file, exit code $($p.ExitCode))" }
          Write-Host $text
          if (-not $text.StartsWith("ok")) { Write-Host "::error::the packaged exe cannot open its app window: $text"; exit 1 }
      - name: Build setup installer
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          & $iscc installer/RemotePCControl.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: RemotePCControl-Windows-x64
          path: |
            dist/RemotePCControl.exe
            dist-installer/RemotePCControl-Setup.exe
      - name: Publish installer to GitHub Release
        if: github.event_name != 'workflow_dispatch' || github.ref_type == 'branch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-build-${{ github.run_number }}"
          Copy-Item dist-installer/RemotePCControl-Setup.exe "RemotePCControl-Setup-$tag.exe"
          gh release create $tag "RemotePCControl-Setup-$tag.exe" --target "${{ github.sha }}" --title "Windows installer #${{ github.run_number }}" --notes "RemotePCControl-Setup.exe built from commit ${{ github.sha }}. Run it once: it sets up administrator rights, autostart and the firewall rule."
