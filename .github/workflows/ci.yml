name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest backend/tests tests -q -rf --tb=short 2>&1 | Tee-Object pytest.log
      - if: failure()
        run: |
          $t = (Get-Content pytest.log -Tail 45) -join "%0A"
          Write-Host "::error title=pytest failures::$t"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: frontend
        run: |
          npm install
          npm run build
