name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest backend/tests tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: frontend
        run: |
          npm install
          npm run build
