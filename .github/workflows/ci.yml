name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest backend/tests tests -q -rf --tb=short 2>&1 | Tee-Object pytest.log
      - if: failure()
        run: |
          $log = Get-Content pytest.log
          $key = ($log | Select-String -Pattern 'Fatal Python error|fatal exception|Tcl_Async|FAILED|^E  ' | Select-Object -First 15 | ForEach-Object { $_.Line }) -join "%0A"
          Write-Host "::error title=pytest key lines::$key"
          $t = ($log | Select-Object -Last 45) -join "%0A"
          Write-Host "::error title=pytest failures::$t"
      # Windows-only check of the Scheduled Task installer: run it twice, expect exactly one task.
      # continue-on-error: needs permission to register tasks on the runner; informational.
      - name: Lock overlay installer is idempotent
        continue-on-error: true
        shell: pwsh
        run: |
          $pyw = Join-Path (Split-Path (Get-Command python).Source) "pythonw.exe"
          .\scripts\install-lock-overlay.ps1 -PythonW $pyw
          .\scripts\install-lock-overlay.ps1 -PythonW $pyw
          $n = @(Get-ScheduledTask | Where-Object { $_.Actions.Arguments -like "*lock_overlay.py*" }).Count
          Write-Host "overlay tasks: $n"
          .\scripts\install-lock-overlay.ps1 -Remove
          if ($n -ne 1) { throw "expected 1 task, found $n" }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: frontend
        run: |
          npm install
          npm run build
