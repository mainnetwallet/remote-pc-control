<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Remote PC Control">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#151a38"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>
  <!-- monitor -->
  <g transform="translate(70,70)">
    <rect x="0" y="0" width="210" height="140" rx="12" fill="#0f172a" stroke="url(#acc)" stroke-width="4"/>
    <rect x="14" y="14" width="182" height="112" rx="4" fill="#111c3a"/>
    <rect x="26" y="28" width="90" height="10" rx="5" fill="#6366f1" fill-opacity="0.8"/>
    <rect x="26" y="48" width="130" height="8" rx="4" fill="#22d3ee" fill-opacity="0.5"/>
    <rect x="26" y="64" width="110" height="8" rx="4" fill="#22d3ee" fill-opacity="0.35"/>
    <path d="M96 84 l0 34 l9 -8 l7 15 l7 -3 l-7 -15 l12 0 z" fill="#fff"/>
    <rect x="90" y="140" width="30" height="22" fill="#1e293b"/>
    <rect x="60" y="162" width="90" height="10" rx="5" fill="#1e293b"/>
  </g>
  <!-- phone -->
  <g transform="translate(190,150)">
    <rect x="0" y="0" width="92" height="170" rx="16" fill="#0f172a" stroke="url(#acc)" stroke-width="4"/>
    <rect x="9" y="22" width="74" height="112" rx="4" fill="#111c3a"/>
    <circle cx="46" cy="155" r="7" fill="none" stroke="#22d3ee" stroke-opacity="0.7" stroke-width="2"/>
    <circle cx="46" cy="78" r="16" fill="none" stroke="#22d3ee" stroke-width="3" stroke-opacity="0.8"/>
    <circle cx="46" cy="78" r="5" fill="#22d3ee"/>
  </g>
  <!-- title -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="354" y="190" font-size="82" font-weight="700" fill="#f8fafc">Remote PC Control</text>
    <text x="356" y="250" font-size="26" fill="#94a3b8">Your Windows PC on your phone: screen, touch, keyboard, power.</text>
  </g>
  <!-- chips -->
  <g font-family="Consolas, Menlo, monospace" font-size="18" fill="#22d3ee">
    <rect x="354" y="305" width="120" height="34" rx="17" fill="none" stroke="#22d3ee" stroke-opacity="0.6"/>
    <text x="378" y="328">WebRTC</text>
    <rect x="490" y="305" width="120" height="34" rx="17" fill="none" stroke="#6366f1" stroke-opacity="0.8"/>
    <text x="512" y="328" fill="#a5b4fc">Android</text>
    <rect x="626" y="305" width="120" height="34" rx="17" fill="none" stroke="#6366f1" stroke-opacity="0.8"/>
    <text x="668" y="328" fill="#a5b4fc">Web</text>
  </g>
</svg>
