[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-pc-control"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "psutil>=6,<8", "mss>=9,<11", "Pillow>=10,<13", "pynput>=1.7,<2", "python-dotenv>=1,<2"]
[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]
build = ["pyinstaller>=6,<7"]
[tool.pytest.ini_options]
testpaths = ["backend/tests", "tests"]
[tool.setuptools]
package-dir = {"" = "backend"}
[tool.setuptools.packages.find]
where = ["backend"]
